frontpage_handlungsfelder:
  - title:  Globale Verantwortung und nachhaltiger Konsum
    slug: verantwortung
    leitsatz: |
      Im Jahr 2030 wird eine Kultur des nachhaltigen Konsums gelebt. Die öffentliche Beschaffung wird nach sozialen und ökologischen Kriterien ausgerichtet. Die Stadtbevölkerung wird umfassend über nachhaltigen Konsum informiert und auch Schulen greifen das Thema auf. Die Stadt Pirmasens vertieft ihre internationalen Partnerschaften und setzt sich für globales Engagement ein. Damit leisten wir als Stadt Pirmasens einen Beitrag zu den Globalen Nachhaltigkeitszielen der Agenda 2030, insbesondere zu den Zielen: SDG 4, SDG 11, SDG 12 sowie SDG 17.
    hf-goals: "4,11,12,17"
    hf-color: '#007ebe'
    icon: "fa-globe"


  - title: Klima- und Umweltschutz
    slug: umwelt
    leitsatz: |
      Pirmasens leistet bis zum Jahr 2030 einen wichtigen Beitrag zum Klimaschutz indem der Anteil erneuerbarer Energien im Energieverbrauch erhöht und die Energieffizienz kommunaler Gebäude verbessert wird um schlussendlich eine klimaneutrale Stadt zu werden. Die Biodiversität und die Klimaresilienz wird kontinuierlich gefördert um nachkommenden Generationen ein lebenswertes Umfeld für ihre zukünftige Entwicklung zu ermöglichen. Damit leisten wir als Stadt Pirmasens einen Beitrag zu den Globalen Nachhaltigkeitszielen der Agenda 2030, insbesondere zu den Zielen: SDG 7, SDG 11, SDG 13 sowie SDG 15.
    hf-goals: "7,11,13,15"
    hf-color: '#65b448'
    icon: "fa-leaf"


  - title: Stadt für alle
    slug: stadt
    leitsatz: |
        Pirmasens ist eine Stadt für alle: Für Junge und Alte, für Schüler und Berufstätige, für Alleinerziehende und Familien, für Erwerbstätige und Erwerbslose, für Gesunde und Kranke, für Singles und Beziehungsmenschen und viele andere mehr. Hilfsbedürftige und sich in sozialer Schieflage befindliche Menschen werden gefördert und in das gesellschaftliche Leben integriert. Verschieden Projekten bilden Familien und jungen Menschen Zugang zu Bildung und Freizeitaktivitäten um ihnen die Chance auf ein erfülltes und erfolgreiches Leben zu ermöglichen. Damit leisten wir als Stadt Pirmasens einen Beitrag zu den Globalen Nachhaltigkeitszielen der Agenda 2030, insbesondere zu den Zielen: SDG 4 und SDG 10.
    hf-goals: "1,4,10"
    hf-color: '#f8b715'
    icon: "fa-restroom"


  - title: Nachhaltiger Standort
    slug: standort
    leitsatz: |
      Pirmasens erfindet sich neu. Die Stadt zeichnet sich durch eine hohe Lebensqualität aus und bietet neben klassischen Wohnformen Raum für neue, innovative Ansätze des Zusammenlebens. Studierende und junge Unternehmen finden ein anregendes und unterstützendes Umfeld. Die Stadt achtet darauf die kommunalen Werte und Finanzen generationsgerecht zu pflegen und zu erhalten. Die Qualitäten von Pirmasens als attraktive, innovative und klimaneutrale Mittelstadt am Rande des Biosphärenreservats Pfälzerwald werden vor Ort gelebt und überregional bekannt gemacht. Damit leisten wir als Stadt Pirmasens einen Beitrag zu den Globalen Nachhaltigkeitszielen der Agenda 2030, insbesondere zu den Zielen: SDG 4, SDG 8, SDG 9, SDG 11 und SDG 16.
    hf-goals: "4,8,9,11,16"
    hf-color: '#ed6d29'
    icon: "fa-seedling"


  - title: Nachhaltige Mobilität
    slug: monilitaet
    leitsatz: |
        Alle Teile von Pirmasens sind 2030 problemlos mit öffentlichen Verkehrsmitteln, mit dem Rad oder zu Fuß zu erreichen. Der KFZ-Verkehr wurde auf das Nötigste reduziert, wodurch Umweltbelastungen gesenkt und Gefahren für Menschen reduziert werden konnten. In Verbindung mit sicheren, inklusiven und attraktiven öffentlichen Räumen ist die Lebensqualität aller Bürgerinnen und Bürger erheblich gesteigert worden. Damit leisten wir als Stadt Pirmasens einen Beitrag zu den Globalen Nachhaltigkeitszielen der Agenda 2030, insbesondere zu den Zielen SDG 11 und 13
    hf-goals: "11,13"
    hf-color: '#05afda'
    icon: "fa-van-shuttle"


